<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#172c3f" />
  <meta name="description" content="A stochastic civic-strategy game about navigating public administration." />
<style>
:root {
  color-scheme: light;
  --ink: #17212b;
  --muted: #5f6c77;
  --paper: #f4f1e9;
  --surface: #fffdf8;
  --surface-strong: #ffffff;
  --line: #d9d4c8;
  --navy: #172c3f;
  --navy-soft: #e5ebef;
  --saffron: #bb6b22;
  --saffron-soft: #f6e9da;
  --green: #326b51;
  --green-soft: #e1eee7;
  --red: #9b3c35;
  --red-soft: #f4e2df;
  --shadow: 0 14px 40px rgba(23, 44, 63, 0.08);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

html { min-height: 100%; background: var(--paper); }

body {
  margin: 0;
  min-height: 100%;
  color: var(--ink);
  background:
    radial-gradient(circle at top left, rgba(187, 107, 34, 0.09), transparent 28rem),
    var(--paper);
}

button, input, select { font: inherit; }
button { touch-action: manipulation; }

.app-shell {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: max(18px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 10px 2px 24px;
}

.topbar h1 { margin: 1px 0 0; font-family: Georgia, serif; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.04em; }
.eyebrow { margin: 0; color: var(--saffron); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.status-badge { padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.72); color: var(--muted); font-size: .78rem; }
.status-badge.online { color: var(--green); border-color: #aac8b8; background: var(--green-soft); }
.status-badge.offline { color: var(--red); border-color: #d7aaa6; background: var(--red-soft); }

.loading-panel, .empty-panel {
  min-height: 420px;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  text-align: center;
  color: var(--muted);
}

.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--saffron); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.hero-card {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: var(--surface);
  box-shadow: var(--shadow);
  padding: clamp(24px, 5vw, 54px);
}
.hero-card::after {
  content: "";
  position: absolute;
  right: -90px;
  top: -110px;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  border: 48px solid rgba(187, 107, 34, .08);
  pointer-events: none;
}
.hero-card h2 { position: relative; margin: 7px 0 12px; max-width: 780px; font: 700 clamp(2rem, 6vw, 4.6rem)/.98 Georgia, serif; letter-spacing: -.05em; }
.hero-card .lead { position: relative; max-width: 720px; color: var(--muted); font-size: clamp(1rem, 2vw, 1.18rem); line-height: 1.65; }

.profile-grid, .scenario-grid { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; margin-top: 32px; }
.profile-card { display: flex; flex-direction: column; min-height: 260px; padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface-strong); }
.scenario-card { display: flex; flex-direction: column; min-height: 280px; padding: 20px; border: 1px solid color-mix(in srgb, var(--scenario-color) 28%, var(--line)); border-top: 5px solid var(--scenario-accent); border-radius: 18px; background: var(--surface-strong); }
.scenario-card h3 { margin: 12px 0 3px; color: var(--scenario-color); font: 700 1.35rem Georgia, serif; }
.scenario-card p { color: var(--muted); line-height: 1.5; }
.scenario-card .resource-preview { display: flex; flex-wrap: wrap; gap: 6px; margin: auto 0 16px; }
.scenario-card .button { background: var(--scenario-color); }
.profile-card h3 { margin: 12px 0 3px; font-size: 1.12rem; }
.profile-card .occupation { color: var(--saffron); font-weight: 700; font-size: .88rem; }
.profile-card p { color: var(--muted); line-height: 1.5; }
.profile-card .resource-preview { display: flex; flex-wrap: wrap; gap: 6px; margin: auto 0 16px; }
.chip { padding: 5px 8px; border-radius: 8px; background: var(--navy-soft); color: var(--navy); font-size: .75rem; font-weight: 700; }
.environment-strip { position: relative; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.environment-strip span { padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-strong); color: var(--muted); font-size: .78rem; }
.back-button { position: relative; margin-top: 18px; }

.button { min-height: 42px; border: 0; border-radius: 11px; padding: 10px 15px; font-weight: 800; cursor: pointer; transition: transform .12s ease, opacity .12s ease, background .12s ease; }
.button:hover { transform: translateY(-1px); }
.button:active { transform: translateY(0); }
.button:disabled { cursor: not-allowed; opacity: .5; transform: none; }
.button-primary { color: white; background: var(--navy); }
.button-secondary { color: var(--navy); border: 1px solid var(--line); background: var(--surface); }
.button-danger { color: var(--red); border: 1px solid #d7aaa6; background: var(--red-soft); }

.game-layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .75fr); gap: 18px; align-items: start; }
.main-column, .side-column { display: grid; gap: 18px; }
.panel { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 8px 26px rgba(23, 44, 63, .05); }
.panel-inner { padding: 22px; }

.generator-callout { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 24px 0; padding: 18px; border: 1px solid color-mix(in srgb, var(--saffron) 45%, var(--line)); border-radius: 15px; background: var(--saffron-soft); }
.campaign-panel { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(210px, .65fr); gap: 14px 20px; margin: 24px 0; padding: 18px; border: 1px solid var(--line); border-radius: 15px; background: var(--navy-soft); }
.campaign-panel strong, .campaign-panel > div > span { display: block; }
.campaign-panel > div > span { margin-top: 4px; color: var(--muted); font-size: .84rem; line-height: 1.4; }
.campaign-panel label { display: grid; gap: 6px; color: var(--navy); font-size: .75rem; font-weight: 850; }
.campaign-panel select, .campaign-panel input { min-height: 42px; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--surface-strong); color: var(--ink); font: inherit; }
.campaign-panel form { grid-column: 1 / -1; display: flex; gap: 8px; }
.campaign-panel form input { flex: 1; }
.campaign-link { margin: 14px 0 0; color: var(--saffron); font-size: .82rem; font-weight: 850; }
.generator-callout strong, .generator-callout span { display: block; }
.generator-callout span { margin-top: 4px; color: var(--muted); font-size: .86rem; }
.generated-badge { float: right; color: var(--saffron); font-size: .67rem; font-weight: 900; letter-spacing: .08em; }
.generator-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
.generator-form > label { display: grid; gap: 7px; color: var(--navy); font-size: .78rem; font-weight: 850; }
.generator-form select, .generator-form input { width: 100%; min-height: 45px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--surface-strong); color: var(--ink); font: inherit; }
.modifier-field { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border: 1px solid var(--line); border-radius: 13px; padding: 14px; }
.modifier-field legend { padding: 0 6px; color: var(--navy); font-size: .78rem; font-weight: 850; }
.check-label { display: flex; align-items: flex-start; gap: 7px; color: var(--muted); font-size: .78rem; line-height: 1.35; }
.check-label input { width: auto; min-height: auto; margin-top: 2px; }
.generator-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; }

.mission-panel { background: var(--navy); color: white; border-color: var(--navy); }
.mission-panel .eyebrow { color: #f1bd82; }
.mission-panel h2 { margin: 7px 0 8px; font: 700 clamp(1.7rem, 4vw, 2.7rem)/1.05 Georgia, serif; letter-spacing: -.03em; }
.mission-panel p { color: #dce5eb; line-height: 1.55; }
.citizen-strip { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.18); }
.citizen-strip strong { display: block; }
.citizen-strip span { color: #c3d1da; font-size: .83rem; }
.turn-number { text-align: right; }
.turn-number strong { font-size: 1.55rem; }

.resource-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.metric-card { padding: 15px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface-strong); }
.metric-card .label { color: var(--muted); font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.metric-card .value { margin-top: 4px; font-size: 1.35rem; font-weight: 850; }

.progress-section { margin-top: 18px; }
.progress-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .9rem; font-weight: 800; }
.progress-track { overflow: hidden; height: 12px; margin-top: 8px; border-radius: 999px; background: #e5e0d6; }
.progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--saffron), #dd9b52); transition: width .5s ease; }
.status-text { margin: 14px 0 0; padding: 13px 15px; border-left: 4px solid var(--saffron); background: var(--saffron-soft); line-height: 1.5; }

.city-panel { overflow: hidden; }
.city-map { position: relative; min-height: 330px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--navy) 22%, var(--line)); border-radius: 17px; background:
  linear-gradient(32deg, transparent 48%, rgba(255,255,255,.64) 49%, rgba(255,255,255,.64) 52%, transparent 53%) 0 0 / 130px 110px,
  linear-gradient(-28deg, transparent 47%, rgba(255,255,255,.5) 48%, rgba(255,255,255,.5) 51%, transparent 52%) 0 0 / 170px 135px,
  color-mix(in srgb, var(--paper) 76%, var(--navy-soft)); }
.city-canvas-host, .city-dom-fallback { position: absolute; inset: 0; }
.city-canvas-host canvas { display: block; width: 100% !important; height: 100% !important; }
.city-dom-fallback[hidden] { display: none; }
.city-map::before, .city-map::after { content: ""; position: absolute; border-radius: 38%; background: color-mix(in srgb, var(--green) 18%, transparent); }
.city-map::before { width: 34%; height: 38%; left: -6%; bottom: -12%; transform: rotate(-12deg); }
.city-map::after { width: 26%; height: 30%; right: -4%; top: -8%; transform: rotate(18deg); }
.city-river { position: absolute; width: 120%; height: 34px; left: -10%; top: 57%; transform: rotate(-5deg); background: color-mix(in srgb, #4b9ac1 50%, transparent); opacity: .55; }
.city-location { position: absolute; z-index: 2; width: 96px; min-height: 54px; transform: translate(-50%, -50%); border: 2px solid var(--line); border-radius: 12px; padding: 7px; background: rgba(255,253,248,.94); color: var(--ink); box-shadow: 0 7px 20px rgba(23,44,63,.13); font-size: .7rem; font-weight: 850; line-height: 1.2; cursor: default; }
.city-location.available { border-color: var(--saffron); cursor: pointer; animation: locationPulse 2.4s ease-in-out infinite; }
.city-location.available:hover, .city-location.available:focus-visible { z-index: 4; transform: translate(-50%, -50%) scale(1.06); outline: 3px solid color-mix(in srgb, var(--saffron) 30%, transparent); }
.city-location.locked { opacity: .66; border-style: dashed; }
.city-location.context { opacity: .78; }
@keyframes locationPulse { 50% { box-shadow: 0 7px 24px color-mix(in srgb, var(--saffron) 35%, transparent); } }

.section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.section-title h3 { margin: 0; font-size: 1.05rem; }
.section-title span { color: var(--muted); font-size: .78rem; }
.action-list { display: grid; gap: 10px; }
.action-button { width: 100%; min-height: 92px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; text-align: left; padding: 15px 16px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--surface-strong); cursor: pointer; }
.action-button:hover:not(:disabled) { border-color: #af9c83; background: #fffaf2; }
.action-button:disabled { cursor: not-allowed; opacity: .56; }
.action-title { display: block; font-weight: 850; }
.action-description { display: block; margin-top: 4px; color: var(--muted); font-size: .84rem; line-height: 1.4; }
.action-cost { display: grid; gap: 4px; min-width: 104px; text-align: right; color: var(--muted); font-size: .75rem; }
.action-cost strong { color: var(--navy); }
.disabled-reason { grid-column: 1 / -1; color: var(--red); font-size: .76rem; }

.secondary-metrics { display: grid; gap: 13px; }
.stat-row { display: grid; gap: 6px; }
.stat-header { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; }
.mini-track { height: 8px; overflow: hidden; border-radius: 999px; background: #e6e1d7; }
.mini-fill { height: 100%; background: var(--navy); border-radius: inherit; }

.timeline { display: grid; gap: 14px; }
.timeline-item { position: relative; padding-left: 22px; }
.timeline-item::before { content: ""; position: absolute; left: 3px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--saffron); }
.timeline-item::after { content: ""; position: absolute; left: 6.5px; top: 19px; bottom: -16px; width: 1px; background: var(--line); }
.timeline-item:last-child::after { display: none; }
.timeline-item h4 { margin: 0 0 3px; font-size: .88rem; }
.timeline-item p { margin: 0; color: var(--muted); font-size: .8rem; line-height: 1.45; }
.event-meta { margin-top: 4px; color: var(--saffron); font-size: .73rem; font-weight: 750; }

.end-banner { padding: 20px; border-radius: 18px; text-align: center; }
.end-banner.won { border: 1px solid #aac8b8; background: var(--green-soft); }
.end-banner.lost { border: 1px solid #d7aaa6; background: var(--red-soft); }
.end-banner h3 { margin: 0 0 6px; font: 700 1.8rem Georgia, serif; }

.result-dialog { width: min(500px, calc(100% - 28px)); border: 0; border-radius: 20px; padding: 0; background: var(--surface); box-shadow: 0 24px 70px rgba(0,0,0,.22); }
.result-dialog::backdrop { background: rgba(17, 30, 41, .65); backdrop-filter: blur(3px); }
.dialog-content { padding: 28px; }
.dialog-content h2 { margin: 7px 0 10px; font: 700 2rem Georgia, serif; }
.dialog-content p { color: var(--muted); line-height: 1.55; }
.delta-line { margin: 16px 0 22px; padding: 12px; border-radius: 10px; background: var(--navy-soft); color: var(--navy); font-weight: 800; }

footer { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 24px 0 0; color: var(--muted); font-size: .75rem; }

@media (max-width: 900px) {
  .game-layout { grid-template-columns: 1fr; }
  .side-column { grid-template-columns: 1fr 1fr; }
  .profile-grid, .scenario-grid { grid-template-columns: 1fr; }
  .profile-card { min-height: auto; }
}

@media (max-width: 640px) {
  .app-shell { width: min(100% - 20px, 1180px); }
  .topbar { align-items: flex-start; }
  .topbar-actions { flex-direction: column; align-items: flex-end; }
  .status-badge { display: none; }
  .hero-card { border-radius: 18px; padding: 24px 18px; }
  .resource-grid { grid-template-columns: 1fr 1fr; }
  .side-column { grid-template-columns: 1fr; }
  .panel-inner { padding: 17px; }
  .action-button { grid-template-columns: 1fr; gap: 8px; }
  .action-cost { display: flex; flex-wrap: wrap; gap: 8px; text-align: left; }
  .citizen-strip { align-items: flex-start; }
  .city-map { min-height: 280px; }
  .city-location { width: 78px; min-height: 48px; font-size: .62rem; }
  .generator-callout { align-items: stretch; flex-direction: column; }
  .campaign-panel { grid-template-columns: 1fr; }
  .campaign-panel form { grid-column: 1; align-items: stretch; flex-direction: column; }
  .generator-form { grid-template-columns: 1fr; }
  .modifier-field { grid-column: 1; grid-template-columns: 1fr; }
  .generator-actions { grid-column: 1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
  <title>The Republic — Civic Strategy Game</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CIVIC SIMULATION</p>
        <h1>The Republic</h1>
      </div>
      <div class="topbar-actions">
        <span id="connectionBadge" class="status-badge">Connecting…</span>
        <button id="newGameButton" class="button button-secondary" type="button" hidden>New game</button>
      </div>
    </header>

    <main id="app" aria-live="polite">
      <section class="loading-panel">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading the civic simulation…</p>
      </section>
    </main>

    <footer>
      <span>Seeded stochastic simulation</span>
      <span>•</span>
      <span>Game state persists in this browser</span>
    </footer>
  </div>

  <dialog id="resultDialog" class="result-dialog">
    <div class="dialog-content">
      <p id="dialogLabel" class="eyebrow">OUTCOME</p>
      <h2 id="dialogTitle">Result</h2>
      <p id="dialogMessage"></p>
      <div id="dialogDelta" class="delta-line"></div>
      <button id="dialogClose" class="button button-primary" type="button">Continue</button>
    </div>
  </dialog>

  <script>(() => {
  const pack = JSON.parse(document.getElementById('embeddedGamePack').textContent);
  const storeKey = 'civic-sim-offline-sessions';
  let memoryStore = {};

  function loadStore() {
    try { return JSON.parse(localStorage.getItem(storeKey) || '{}'); }
    catch { return structuredClone(memoryStore); }
  }

  function saveStore(store) {
    memoryStore = structuredClone(store);
    try { localStorage.setItem(storeKey, JSON.stringify(store)); }
    catch { /* opaque origins use the in-memory fallback */ }
  }

  function randomId() {
    return globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function mulberry32(seed) {
    return function next() {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function integer(rng, min, max) {
    return Math.floor(rng() * (max - min + 1)) + min;
  }

  function metric(session, name) {
    if (Object.hasOwn(session.values || {}, name)) return Number(session.values[name]);
    if (Object.hasOwn(session.hidden_values || {}, name)) return Number(session.hidden_values[name]);
    if (Object.hasOwn(session.persistent_consequences || {}, name)) return Number(session.persistent_consequences[name]);
    const lookup = {
      progress: session.metrics.progress,
      documentation: session.metrics.documentation,
      community_support: session.metrics.community_support,
      public_attention: session.metrics.public_attention,
      integrity: session.metrics.integrity,
      money: session.resources.money,
      energy: session.resources.energy,
      influence: session.resources.influence,
      days_remaining: session.resources.days_remaining,
      departmental_backlog: session.hidden.departmental_backlog,
      officer_integrity: session.hidden.officer_integrity,
      election_pressure: session.hidden.election_pressure,
      corruption_pressure: session.hidden.corruption_pressure,
    };
    return Number(lookup[name] ?? 0);
  }

  function checkAction(session, action) {
    const useLimit = action.max_uses ?? 1;
    const useCount = session.events.filter((event) => event.kind === 'action' && event.action_id === action.id).length;
    if (useCount >= useLimit) return 'action unavailable: this opportunity has already been used';
    const cost = action.cost;
    if (session.resources.money < cost.money || session.resources.energy < cost.energy || session.resources.influence < cost.influence || session.resources.days_remaining <= cost.days) {
      return `insufficient resources: requires ₹${cost.money}, ${cost.energy} energy, ${cost.influence} influence and ${cost.days} days`;
    }
    for (const [id, required] of Object.entries(cost.values || {})) {
      if (metric(session, id) < required) return `insufficient resources: requires ${required} ${id}`;
    }
    for (const requirement of action.requirements || []) {
      const value = metric(session, requirement.metric);
      if ((requirement.min != null && value < requirement.min) || (requirement.max != null && value > requirement.max)) return `action unavailable: ${requirement.message}`;
    }
    return null;
  }

  function publicValueSnapshot(session) {
    return {
      ...(session.values || {}),
      money: session.resources.money,
      energy: session.resources.energy,
      influence: session.resources.influence,
      days_remaining: session.resources.days_remaining,
      progress: session.metrics.progress,
      documentation: session.metrics.documentation,
      community_support: session.metrics.community_support,
      public_attention: session.metrics.public_attention,
      integrity: session.metrics.integrity,
    };
  }

  function valueChanges(before, after) {
    return Object.fromEntries(
      [...new Set([...Object.keys(before), ...Object.keys(after)])]
        .map((id) => [id, (after[id] || 0) - (before[id] || 0)])
        .filter(([, change]) => change !== 0),
    );
  }

  function applyDelta(session, delta = {}) {
    const resources = delta.resources || {};
    session.resources.money += resources.money || 0;
    session.resources.energy += resources.energy || 0;
    session.resources.influence += resources.influence || 0;
    session.resources.days_remaining += resources.days_remaining || 0;
    session.metrics.progress += delta.progress || 0;
    session.metrics.documentation += delta.documentation || 0;
    session.metrics.community_support += delta.community_support || 0;
    session.metrics.public_attention += delta.public_attention || 0;
    session.metrics.integrity += delta.integrity || 0;
    const legacy = {
      money: ['resources', 'money'], energy: ['resources', 'energy'], influence: ['resources', 'influence'], days_remaining: ['resources', 'days_remaining'],
      progress: ['metrics', 'progress'], documentation: ['metrics', 'documentation'], community_support: ['metrics', 'community_support'], public_attention: ['metrics', 'public_attention'], integrity: ['metrics', 'integrity'],
    };
    for (const [id, change] of Object.entries(delta.values || {})) {
      session.values[id] = (session.values[id] || 0) + change;
      const target = legacy[id];
      if (target) session[target[0]][target[1]] = session.values[id];
    }
    for (const [id, change] of Object.entries(delta.consequences || {})) {
      session.persistent_consequences[id] = (session.persistent_consequences[id] || 0) + change;
    }
    syncLegacyValues(session);
  }

  function syncLegacyValues(session) {
    Object.assign(session.values, {
      money: session.resources.money,
      energy: session.resources.energy,
      influence: session.resources.influence,
      days_remaining: session.resources.days_remaining,
      progress: session.metrics.progress,
      documentation: session.metrics.documentation,
      community_support: session.metrics.community_support,
      public_attention: session.metrics.public_attention,
      integrity: session.metrics.integrity,
    });
  }

  function clamp(session) {
    for (const key of ['progress', 'documentation', 'community_support', 'public_attention', 'integrity']) {
      session.metrics[key] = Math.max(0, Math.min(100, session.metrics[key]));
    }
    session.resources.energy = Math.max(0, Math.min(100, session.resources.energy));
    session.resources.influence = Math.max(0, Math.min(100, session.resources.influence));
    session.resources.days_remaining = Math.max(0, session.resources.days_remaining);
    for (const definition of pack.value_definitions || []) {
      if (Object.hasOwn(session.values, definition.id)) {
        session.values[definition.id] = Math.max(definition.min ?? 0, Math.min(definition.max ?? 100, session.values[definition.id]));
      }
    }
    syncLegacyValues(session);
  }

  function resolve(session) {
    const ending = (pack.endings || []).find((candidate) => (candidate.conditions || []).every((condition) => {
      const value = metric(session, condition.metric);
      return (condition.min == null || value >= condition.min) && (condition.max == null || value <= condition.max);
    }));
    if (ending) {
      session.status = ending.status;
      session.ending_id = ending.id;
      session.current_status = ending.message;
    } else if (!(pack.endings || []).length && session.metrics.progress >= pack.mission.win_progress) {
      session.status = 'won';
      session.current_status = 'The mission objectives have been completed.';
    } else if (session.resources.days_remaining <= 0) {
      session.status = 'lost';
      session.current_status = 'The deadline expired before the work could be completed.';
    } else if (session.resources.energy <= 0) {
      session.status = 'lost';
      session.current_status = 'The citizen exhausted their capacity to continue pursuing the case.';
    } else if (session.resources.money < 0) {
      session.status = 'lost';
      session.current_status = 'The citizen can no longer finance the campaign.';
    }
  }

  function publicState(session) {
    const values = {
      ...(session.values || {}),
      money: session.resources.money,
      energy: session.resources.energy,
      influence: session.resources.influence,
      days_remaining: session.resources.days_remaining,
      progress: session.metrics.progress,
      documentation: session.metrics.documentation,
      community_support: session.metrics.community_support,
      public_attention: session.metrics.public_attention,
      integrity: session.metrics.integrity,
    };
    const indicators = (pack.value_definitions || []).filter((definition) => !definition.hidden_from_hud).map((definition) => ({
      id: definition.id,
      label: definition.label,
      description: definition.description || '',
      group: definition.group || 'metric',
      value: Number(values[definition.id] || 0),
      min: definition.min ?? 0,
      max: definition.max ?? 100,
      format: definition.format || 'number',
    }));
    return {
      id: session.id,
      game_pack_id: session.game_pack_id,
      game_pack_version: session.game_pack_version || pack.version,
      citizen_id: session.citizen_id,
      citizen_name: session.citizen_name,
      citizen_context: session.citizen_context,
      mission_title: session.mission_title,
      objective: session.objective,
      current_status: session.current_status,
      resources: structuredClone(session.resources),
      metrics: structuredClone(session.metrics),
      values,
      indicators,
      persistent_consequences: structuredClone(session.persistent_consequences || {}),
      status: session.status,
      ending_id: session.ending_id || null,
      turn: session.turn,
      events: structuredClone(session.events),
      available_actions: session.status !== 'active' ? [] : pack.actions
        .filter((action) => !checkAction(session, action))
        .map((action) => ({
          id: action.id,
          title: action.title,
          description: action.description,
          action_type: action.action_type || '',
          location_id: action.location_id || null,
          cost: action.cost,
          enabled: true,
          disabled_reason: null,
        })),
    };
  }

  function create(citizenId, existingId = null) {
    const citizen = pack.citizens.find((item) => item.id === citizenId);
    if (!citizen) throw new Error('citizen profile not found');
    const seed = Math.floor(Math.random() * 0xFFFFFFFF);
    const rng = mulberry32(seed);
    const values = {
      ...(citizen.starting_values || {}),
      money: citizen.starting_resources.money,
      energy: citizen.starting_resources.energy,
      influence: citizen.starting_resources.influence,
      days_remaining: citizen.starting_resources.days_remaining,
      progress: citizen.starting_metrics.progress,
      documentation: citizen.starting_metrics.documentation,
      community_support: citizen.starting_metrics.community_support,
      public_attention: citizen.starting_metrics.public_attention,
      integrity: citizen.starting_metrics.integrity,
    };
    return {
      id: existingId || randomId(),
      game_pack_id: pack.id,
      game_pack_version: pack.version,
      citizen_id: citizen.id,
      citizen_name: citizen.name,
      citizen_context: citizen.context,
      mission_title: pack.mission.title,
      objective: pack.mission.objective,
      current_status: pack.mission.starting_status,
      resources: structuredClone(citizen.starting_resources),
      metrics: structuredClone(citizen.starting_metrics),
      values,
      hidden: {
        departmental_backlog: integer(rng, 30, 90),
        officer_integrity: integer(rng, 25, 95),
        election_pressure: integer(rng, 10, 90),
        corruption_pressure: integer(rng, 10, 85),
      },
      hidden_values: {},
      persistent_consequences: {},
      triggered_random_events: [],
      status: 'active',
      turn: 0,
      seed,
      events: [],
      action_results: {},
      ending_id: null,
    };
  }

  function act(session, request) {
    if (session.action_results[request.client_action_id]) return session.action_results[request.client_action_id];
    if (session.status !== 'active') throw new Error('session is already finished');
    const action = pack.actions.find((item) => item.id === request.action_id);
    if (!action) throw new Error('action not found');
    const unavailable = checkAction(session, action);
    if (unavailable) throw new Error(unavailable);
    const valuesBefore = publicValueSnapshot(session);

    session.resources.money -= action.cost.money;
    session.resources.energy -= action.cost.energy;
    session.resources.influence -= action.cost.influence;
    session.resources.days_remaining -= action.cost.days;
    for (const [id, value] of Object.entries(action.cost.values || {})) {
      session.values[id] = (session.values[id] || 0) - value;
    }
    applyDelta(session, action.guaranteed_effect);

    const rng = mulberry32((session.seed ^ Math.imul(session.turn + 1, 0x9E3779B9)) >>> 0);
    const weighted = action.outcomes.map((outcome) => {
      let weight = outcome.base_weight;
      for (const condition of outcome.conditions || []) {
        const value = metric(session, condition.metric);
        const matches = (condition.min == null || value >= condition.min) && (condition.max == null || value <= condition.max);
        if (matches) weight *= condition.multiplier;
      }
      return { outcome, weight: Math.max(0.001, weight) };
    });
    const total = weighted.reduce((sum, item) => sum + item.weight, 0);
    let roll = rng() * total;
    let selected = weighted[weighted.length - 1].outcome;
    for (const item of weighted) {
      if (roll < item.weight) { selected = item.outcome; break; }
      roll -= item.weight;
    }

    const before = session.metrics.progress;
    applyDelta(session, selected.effect);
    session.metrics.progress += selected.progress_max > selected.progress_min
      ? integer(rng, selected.progress_min, selected.progress_max)
      : selected.progress_min;
    clamp(session);
    session.turn += 1;
    session.current_status = selected.message;
    resolve(session);
    const progressChange = session.metrics.progress - before;
    const changes = valueChanges(valuesBefore, publicValueSnapshot(session));
    session.events.push({
      turn: session.turn,
      action_id: action.id,
      action_title: action.title,
      outcome_id: selected.id,
      message: selected.message,
      progress_change: progressChange,
      resources_after: structuredClone(session.resources),
      kind: 'action',
      value_changes: changes,
      visual_event: selected.visual_event || null,
    });
    const response = {
      outcome_id: selected.id,
      message: selected.message,
      progress_change: progressChange,
      value_changes: changes,
      visual_event: selected.visual_event || null,
      state: publicState(session),
    };
    session.action_results[request.client_action_id] = response;
    return response;
  }

  function jsonResponse(body, status = 200) {
    return Promise.resolve(new Response(JSON.stringify(body), {
      status,
      headers: { 'Content-Type': 'application/json' },
    }));
  }

  globalThis.fetch = async (input, options = {}) => {
    try {
      const url = new URL(String(input), 'http://offline.local');
      const path = url.pathname;
      const method = (options.method || 'GET').toUpperCase();
      const sessions = loadStore();

      if (path === '/api/v1/health' && method === 'GET') {
        return jsonResponse({ status: 'ok', game_pack: pack.id, version: 'offline', sessions: Object.keys(sessions).length, campaigns_supported: false });
      }
      if (path === '/api/v1/scenario' && method === 'GET') {
        return jsonResponse({
          schema_version: pack.schema_version || 1,
          id: pack.id,
          title: pack.title,
          description: pack.description,
          version: pack.version,
          environment: pack.environment || {},
          mission: pack.mission,
          value_definitions: pack.value_definitions || [],
          institutions: pack.institutions || [],
          stakeholders: pack.stakeholders || [],
          barriers: pack.barriers || [],
          visual_theme: pack.visual_theme || {},
          citizens: pack.citizens,
        });
      }
      if (path === '/api/v1/scenarios' && method === 'GET') {
        return jsonResponse([{
          id: pack.id,
          title: pack.title,
          description: pack.description,
          version: pack.version,
          objective_type: pack.mission.objective_type || '',
          world_region: pack.environment?.world_region || '',
          role_count: pack.citizens.length,
          visual_theme: pack.visual_theme || {},
        }]);
      }
      if (path === '/api/v1/scenario-generator' && method === 'GET') {
        return jsonResponse({ schema_version: 1, categories: {}, difficulties: [], modifiers: [], templates: [] });
      }
      if (path === '/api/v1/campaigns' && method === 'GET') {
        return jsonResponse([]);
      }
      if (path === `/api/v1/scenarios/${pack.id}` && method === 'GET') {
        return jsonResponse({
          schema_version: pack.schema_version || 1,
          id: pack.id,
          title: pack.title,
          description: pack.description,
          version: pack.version,
          environment: pack.environment || {},
          mission: pack.mission,
          value_definitions: pack.value_definitions || [],
          institutions: pack.institutions || [],
          stakeholders: pack.stakeholders || [],
          barriers: pack.barriers || [],
          visual_theme: pack.visual_theme || {},
          citizens: pack.citizens,
        });
      }
      if (path === '/api/v1/sessions' && method === 'POST') {
        const body = JSON.parse(options.body || '{}');
        if (body.scenario_id && body.scenario_id !== pack.id) return jsonResponse({ error: 'scenario not found in standalone mode' }, 404);
        const session = create(body.profile_id || body.citizen_id);
        sessions[session.id] = session;
        saveStore(sessions);
        return jsonResponse(publicState(session), 201);
      }
      const match = path.match(/^\/api\/v1\/sessions\/([^/]+)(?:\/(actions|reset))?$/);
      if (match) {
        const id = decodeURIComponent(match[1]);
        const operation = match[2];
        let session = sessions[id];
        if (!session) return jsonResponse({ error: 'session not found' }, 404);
        if (!operation && method === 'GET') return jsonResponse(publicState(session));
        if (operation === 'actions' && method === 'POST') {
          const result = act(session, JSON.parse(options.body || '{}'));
          sessions[id] = session;
          saveStore(sessions);
          return jsonResponse(result);
        }
        if (operation === 'reset' && method === 'POST') {
          session = create(session.citizen_id, id);
          sessions[id] = session;
          saveStore(sessions);
          return jsonResponse(publicState(session));
        }
      }
      return jsonResponse({ error: 'offline route not found' }, 404);
    } catch (error) {
      return jsonResponse({ error: error instanceof Error ? error.message : String(error) }, 400);
    }
  };
})();

function mountCityRenderer() {
  const host = document.getElementById('cityCanvasHost');
  const fallback = document.getElementById('cityDomFallback');
  if (!host || typeof globalThis.CivicCityRenderer !== 'function') return;
  try {
    cityRenderer = new globalThis.CivicCityRenderer({
      parent: host,
      scenario,
      state,
      visualEvent: pendingVisualEvent,
      locked: requestInFlight,
      onAction: (actionId) => takeAction(actionId),
    });
    fallback?.setAttribute('hidden', '');
  } catch (error) {
    console.warn('Visual city unavailable; using DOM fallback.', error);
    host.remove();
    fallback?.removeAttribute('hidden');
  }
}

function formatMoney(value) {
  return new Intl.NumberFormat('en-IN', {
    style: 'currency',
    currency: 'INR',
    maximumFractionDigits: 0,
  }).format(value);
}

function applyScenarioTheme() {
  const theme = scenario?.visual_theme;
  document.documentElement.style.setProperty('--navy', theme?.primary_color || '#172c3f');
  document.documentElement.style.setProperty('--saffron', theme?.accent_color || '#bb6b22');
  document.documentElement.style.setProperty('--paper', theme?.background_color || '#f4f1e9');
}

async function createCampaign(event) {
  event.preventDefault();
  if (requestInFlight) return;
  const form = event.currentTarget;
  const name = new FormData(form).get('name');
  requestInFlight = true;
  try {
    const campaign = await api('/api/v1/campaigns', { method: 'POST', body: JSON.stringify({ name }) });
    campaigns.push({ id: campaign.id, name: campaign.name, mission_count: 0, values: {} });
    activeCampaignId = campaign.id;
    storageSet(campaignStorageKey, campaign.id);
    renderScenarioSelection();
  } catch (error) {
    alert(error.message);
  } finally {
    requestInFlight = false;
  }
}

async function generateWorld(event, fullyRandom) {
  event.preventDefault();
  if (requestInFlight) return;
  const form = document.getElementById('generatorForm');
  const data = new FormData(form);
  const selections = {};
  if (!fullyRandom) {
    for (const [id] of generatorFields) {
      const value = data.get(id);
      if (value) selections[id] = value;
    }
  }
  const seedText = fullyRandom ? '' : data.get('seed');
  const payload = {
    selections,
    difficulty: fullyRandom ? 'standard' : data.get('difficulty'),
    modifiers: fullyRandom ? [] : data.getAll('modifier'),
    randomize_unspecified: true,
  };
  if (seedText) payload.seed = Number(seedText);
  requestInFlight = true;
  form.querySelectorAll('button,select,input').forEach((control) => { control.disabled = true; });
  try {
    scenario = await api('/api/v1/scenarios/generate', { method: 'POST', body: JSON.stringify(payload) });
    applyScenarioTheme();
    renderProfileSelection();
  } catch (error) {
    alert(error.message);
    renderGenerator();
  } finally {
    requestInFlight = false;
  }
}

async function selectScenario(scenarioId) {
  if (requestInFlight) return;
  requestInFlight = true;
  try {
    scenario = await api(`/api/v1/scenarios/${encodeURIComponent(scenarioId)}`);
    applyScenarioTheme();
    renderProfileSelection();
  } catch (error) {
    alert(error.message);
  } finally {
    requestInFlight = false;
  }
}

function createClientActionId() {
  if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
  return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(options.headers || {}),
    },
  });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.error || `Request failed (${response.status})`);
  return body;
}

function setConnection(isOnline, label = null) {
  connectionBadge.textContent = label || (isOnline ? 'Server online' : 'Server unavailable');
  connectionBadge.className = `status-badge ${isOnline ? 'online' : 'offline'}`;
}

    </section>`;
  document.getElementById('retryButton').addEventListener('click', boot);
}

function costHtml(cost) {
  const entries = [];
  if (cost.money) entries.push(`<span><strong>${formatMoney(cost.money)}</strong></span>`);
  if (cost.energy) entries.push(`<span>${cost.energy} energy</span>`);
  if (cost.influence) entries.push(`<span>${cost.influence} influence</span>`);
  if (cost.days) entries.push(`<span>${cost.days} days</span>`);
  for (const [id, value] of Object.entries(cost.values || {})) {
    const definition = scenario?.value_definitions?.find((item) => item.id === id);
    entries.push(`<span>${value} ${escapeHtml(definition?.label || id)}</span>`);
  }
  return entries.join('');
}

function formatIndicator(indicator) {
  if (indicator.format === 'money') return formatMoney(indicator.value);
  if (indicator.format === 'days') return `${indicator.value}`;
  if (indicator.format === 'percent') return `${indicator.value}%`;
  return String(indicator.value);
}

function factorDisplay(indicator) {
  if (indicator.id === 'evidence_stage') {
    return ['Unverified', 'Independently verified', 'Corroborated', 'Chain of custody confirmed', 'Legally admissible'][indicator.value] || `Stage ${indicator.value}`;
  }
  return indicator.format === 'percent' ? `${indicator.value}%` : `${indicator.value}/${indicator.max}`;
}

function metricBar(indicator) {
  const { label, value, min = 0, max = 100 } = indicator;
  const range = Math.max(1, max - min);
  const percent = Math.max(0, Math.min(100, ((value - min) / range) * 100));
  return `
    <div class="stat-row">
      <div class="stat-header"><span>${escapeHtml(label)}</span><strong>${escapeHtml(factorDisplay(indicator))}</strong></div>
      <div class="mini-track"><div class="mini-fill" style="width:${percent}%"></div></div>
    </div>`;
}

function factorChangeLines(changes, currentState = state, includeCurrentValue = false) {
  const indicators = new Map(
    (currentState?.indicators || [])
      .filter((indicator) => indicator.group !== 'resource' && indicator.id !== 'progress')
      .map((indicator) => [indicator.id, indicator]),
  );
  return Object.entries(changes || {})
    .filter(([id, value]) => value !== 0 && indicators.has(id))
    .map(([id, value]) => {
      const indicator = indicators.get(id);
      if (id === 'evidence_stage') return `${indicator.label} → ${factorDisplay(indicator)}`;
      const signed = `${value > 0 ? '+' : ''}${value}${indicator.format === 'percent' ? '%' : ''}`;
      const current = includeCurrentValue ? ` → ${factorDisplay(indicator)}` : '';
      return `${indicator.label} ${signed}${current}`;
    });
}

function eventChangeSummary(event) {
  const changes = factorChangeLines(event.value_changes).slice(0, 3);
  return changes.length ? changes.join(' · ') : 'No visible civic factor changed';
}

function cityMapHtml() {
  const locations = scenario?.visual_theme?.locations || [];
  const validActions = state.available_actions.filter((action) => action.enabled);
  if (!locations.length) return '';
  const rendererAvailable = typeof globalThis.CivicCityRenderer === 'function';
  return `
    <section class="panel city-panel">
      <div class="panel-inner">
        <div class="section-title"><h3>Civic environment</h3><span>${escapeHtml(scenario.environment.world_region)}</span></div>
        <div class="city-map" role="group" aria-label="Scenario institutions and action locations">
          ${rendererAvailable ? '<div id="cityCanvasHost" class="city-canvas-host" aria-hidden="true"></div>' : ''}
          <div id="cityDomFallback" class="city-dom-fallback" ${rendererAvailable ? 'hidden' : ''}>
            <div class="city-river" aria-hidden="true"></div>
            ${locations.map((location) => {
            const selectable = validActions.find((action) => action.location_id === location.id);
            if (!selectable) return `<span class="city-location context" style="left:${location.x}%;top:${location.y}%"><span>${escapeHtml(location.label)}</span></span>`;
            return `<button class="city-location available" style="left:${location.x}%;top:${location.y}%" type="button" ${requestInFlight ? 'disabled' : ''} data-action-id="${escapeHtml(selectable.id)}" aria-label="${escapeHtml(location.label)}: ${escapeHtml(selectable.title)}"><span>${escapeHtml(location.label)}</span></button>`;
            }).join('')}
          </div>
        </div>
      </div>
    </section>`;
}

function renderGame() {
  destroyCityRenderer();
  newGameButton.hidden = false;
  const statusClass = state.status === 'won' ? 'won' : 'lost';
  const finished = state.status !== 'active';
  const newestEvents = [...state.events].reverse();
  const resourceIndicators = state.indicators.filter((indicator) => indicator.group === 'resource');
  const metricIndicators = state.indicators.filter((indicator) => indicator.group !== 'resource' && indicator.id !== 'progress');
  const validActions = state.available_actions.filter((action) => action.enabled);

  app.innerHTML = `
    <div class="game-layout">
      <div class="main-column">
        <section class="panel mission-panel">
          <div class="panel-inner">
            <p class="eyebrow">CURRENT MISSION</p>
            <h2>${escapeHtml(state.mission_title)}</h2>
            <p>${escapeHtml(state.objective)}</p>
            <div class="citizen-strip">
              <div><strong>${escapeHtml(state.citizen_name)}</strong><span>${escapeHtml(state.citizen_context)}</span></div>
              <div class="turn-number"><span>Turn</span><strong>${state.turn}</strong></div>
            </div>
          </div>
        </section>

        ${cityMapHtml()}

        <section class="panel">
          <div class="panel-inner">
            <div class="resource-grid">
              ${resourceIndicators.map((indicator) => `<div class="metric-card"><div class="label">${escapeHtml(indicator.label)}</div><div class="value">${escapeHtml(formatIndicator(indicator))}</div></div>`).join('')}
            </div>
            <div class="progress-section">
              <div class="progress-heading"><span>Current situation</span><span>${metricIndicators.length} tracked factors</span></div>
              <p class="status-text">${escapeHtml(state.current_status)}</p>
            </div>
          </div>
        </section>

        ${finished ? `
          <section class="end-banner ${statusClass}">
            <h3>${state.status === 'won' ? 'Mission completed' : 'Mission failed'}</h3>
            <p>${escapeHtml(state.current_status)}</p>
            <button id="restartButton" class="button ${state.status === 'won' ? 'button-primary' : 'button-danger'}" type="button">Restart with the same citizen</button>
          </section>` : `
          <section class="panel">
            <div class="panel-inner">
              <div class="section-title"><h3>Choose the next action</h3><span>Outcomes are uncertain</span></div>
              <div class="action-list">
                ${validActions.map((action) => `
                  <button class="action-button" type="button" data-action-id="${escapeHtml(action.id)}" ${requestInFlight ? 'disabled' : ''}>
                    <span>
                      <span class="action-title">${escapeHtml(action.title)}</span>
                      <span class="action-description">${escapeHtml(action.description)}</span>
                    </span>
                    <span class="action-cost">${costHtml(action.cost)}</span>
                  </button>`).join('') || '<p class="action-description">No valid action is currently available.</p>'}
              </div>
            </div>
          </section>`}
      </div>

      <aside class="side-column">
        <section class="panel">
          <div class="panel-inner">
            <div class="section-title"><h3>Civic capacity</h3><span>Public knowledge</span></div>
            <div class="secondary-metrics">
              ${metricIndicators.map(metricBar).join('')}
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-inner">
            <div class="section-title"><h3>Case history</h3><span>${state.events.length} events</span></div>
            <div class="timeline">
              ${newestEvents.length ? newestEvents.map((event) => `
                <article class="timeline-item">
                  <h4>Turn ${event.turn}: ${event.kind === 'random_event' ? 'World event — ' : ''}${escapeHtml(event.action_title)}</h4>
                  <p>${escapeHtml(event.message)}</p>
                  <div class="event-meta">${escapeHtml(eventChangeSummary(event))} · ${event.resources_after.days_remaining} days left</div>
                </article>`).join('') : '<p class="action-description">No official action has been taken yet.</p>'}
            </div>
          </div>
        </section>
      </aside>
    </div>`;

  document.querySelectorAll('.action-button[data-action-id]').forEach((button) => {
    button.addEventListener('click', () => takeAction(button.dataset.actionId));
  });
  document.querySelectorAll('.city-location[data-action-id]').forEach((button) => {
    button.addEventListener('click', () => takeAction(button.dataset.actionId));
  });
  document.getElementById('restartButton')?.addEventListener('click', resetSession);
  mountCityRenderer();
  pendingVisualEvent = null;
}

async function startSession(citizenId) {
  if (requestInFlight) return;
  requestInFlight = true;
  try {
    const created = await api('/api/v1/sessions', {
      method: 'POST',
      body: JSON.stringify({ scenario_id: scenario.id, profile_id: citizenId, citizen_id: citizenId, campaign_id: activeCampaignId }),
    });
    state = created;
    storageSet(sessionStorageKey, state.id);
    requestInFlight = false;
    renderGame();
  } catch (error) {
    alert(error.message);
  } finally {
    requestInFlight = false;
  }
}

async function takeAction(actionId) {
  if (requestInFlight || state.status !== 'active') return;
  requestInFlight = true;
  renderGame();
  try {
    const result = await api(`/api/v1/sessions/${encodeURIComponent(state.id)}/actions`, {
      method: 'POST',
      body: JSON.stringify({
        action_id: actionId,
        client_action_id: createClientActionId(),
      }),
    });
    state = result.state;
    pendingVisualEvent = result.visual_event || null;
    if (state.status !== 'active' && state.campaign_id) {
      campaigns = await api('/api/v1/campaigns');
    }
    dialogLabel.textContent = state.status === 'won' ? 'MISSION COMPLETE' : state.status === 'lost' ? 'MISSION ENDED' : 'STOCHASTIC OUTCOME';
    dialogTitle.textContent = state.status === 'won' ? 'Thresholds secured' : state.status === 'lost' ? 'Campaign ended' : 'Civic progress by factor';
    dialogMessage.textContent = result.message;
    const factorChanges = factorChangeLines(result.value_changes, state, true);
    dialogDelta.textContent = factorChanges.length
      ? factorChanges.join(' · ')
      : 'No visible civic factor changed in this outcome.';
    if (typeof resultDialog.showModal === 'function') resultDialog.showModal();
  } catch (error) {
    alert(error.message);
    await restoreSession();
  } finally {
    requestInFlight = false;
    renderGame();
  }
}

async function resetSession() {
  if (!state || requestInFlight) return;
  requestInFlight = true;
  try {
    state = await api(`/api/v1/sessions/${encodeURIComponent(state.id)}/reset`, { method: 'POST', body: '{}' });
    requestInFlight = false;
    renderGame();
  } catch (error) {
    alert(error.message);
  } finally {
    requestInFlight = false;
  }
}

async function restoreSession() {
  const sessionId = storageGet(sessionStorageKey);
  if (!sessionId) return false;
  try {
    state = await api(`/api/v1/sessions/${encodeURIComponent(sessionId)}`);
    if (state.campaign_id) {
      activeCampaignId = state.campaign_id;
      storageSet(campaignStorageKey, activeCampaignId);
    }
    if (!scenario || scenario.id !== state.game_pack_id) {
      scenario = await api(`/api/v1/scenarios/${encodeURIComponent(state.game_pack_id)}`);
      applyScenarioTheme();
    }
    renderGame();
    return true;
  } catch {
    storageRemove(sessionStorageKey);
    return false;
  }
}

async function boot() {
  app.innerHTML = '<section class="loading-panel"><div class="spinner" aria-hidden="true"></div><p>Loading the civic simulation…</p></section>';
  try {
    const [health, loadedScenarios, loadedGenerator, loadedCampaigns] = await Promise.all([
      api('/api/v1/health'),
      api('/api/v1/scenarios'),
      api('/api/v1/scenario-generator'),
      api('/api/v1/campaigns'),
    ]);
    scenarios = loadedScenarios;
    generatorCatalog = loadedGenerator;
    campaigns = loadedCampaigns;
    campaignsSupported = health.campaigns_supported !== false;
    const storedCampaign = storageGet(campaignStorageKey);
    activeCampaignId = campaigns.some((item) => item.id === storedCampaign) ? storedCampaign : null;
    setConnection(true, `${health.sessions} saved session${health.sessions === 1 ? '' : 's'}`);
    const restored = await restoreSession();
    if (!restored) renderScenarioSelection();
  } catch (error) {
    setConnection(false);
    renderError(error.message);
  }
}

newGameButton.addEventListener('click', () => {
  if (!confirm('Start a new game? The current session remains saved on the server.')) return;
  state = null;
  storageRemove(sessionStorageKey);
  renderScenarioSelection();
});

dialogClose.addEventListener('click', () => resultDialog.close());
window.addEventListener('online', () => setConnection(true));
window.addEventListener('offline', () => setConnection(false));

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

boot();
</script>
